name: Release

# Builds LLMTray.app and attaches it (as a drag-to-Applications .dmg) to a
# GitHub Release whenever a version tag is pushed. Ad-hoc signed only (no
# Developer ID/notarization secrets configured) -- users launch it once via
# right-click > Open to clear Gatekeeper, same as any unsigned/ad-hoc app
# from outside the App Store.
#
# The asset is always named LLMTray.dmg (no version in the filename) so
# https://github.com/<owner>/<repo>/releases/latest/download/LLMTray.dmg
# is a permanent link to whatever's newest -- used by docs/index.html's
# download button, which would otherwise need editing on every release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build LLMTray.app
        run: ./scripts/build_app.sh
      - name: Build DMG
        run: ./scripts/build_dmg.sh
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: .build/app/LLMTray.dmg
          generate_release_notes: true
