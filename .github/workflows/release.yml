name: Release

# Builds LLMTray.app and attaches it (as a drag-to-Applications .dmg) to a
# GitHub Release whenever a version tag is pushed. Ad-hoc signed only (no
# Developer ID/notarization secrets configured) -- users launch it once via
# right-click > Open to clear Gatekeeper, same as any unsigned/ad-hoc app
# from outside the App Store.
#
# Produces two DMGs from the same build: LLMTray.dmg (thin -- bootstraps
# mlx-lm via pip on first launch) and LLMTray-Full.dmg (same app with an
# official-python.org-sourced Python + mlx-lm already vendored inside the
# bundle, for machines with no compatible Python or that would rather skip
# the first-run install). Both are built from the *same* .build/app/LLMTray.app
# directory -- build_full_app.sh mutates it in place after the thin DMG is
# already captured, so the two DMGs must be built in this order.
#
# Asset names have no version in them so
# https://github.com/<owner>/<repo>/releases/latest/download/LLMTray.dmg
# (and .../LLMTray-Full.dmg) are permanent links to whatever's newest --
# used by docs/index.html's download buttons, which would otherwise need
# editing on every release.
# Tags vX.Y.Z (stable) or vX.Y.Z-beta.N (beta: GitHub pre-release, and an
# appcast item on Sparkle's "beta" channel that only users with "Receive
# beta updates" on are offered -- see generate_appcast.sh).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# One release at a time: each one reads and rewrites main's appcast.xml, so
# two concurrent runs (a stable and a beta tag pushed together) would lose
# one channel's item or fail the second push. Queued, never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build LLMTray.app
        run: ./scripts/build_app.sh
        env:
          VERSION: ${{ env.VERSION }}
      - name: Build DMG (thin)
        run: ./scripts/build_dmg.sh
      - name: Vendor full runtime into LLMTray.app
        run: ./scripts/build_full_app.sh
      - name: Build DMG (full)
        run: ./scripts/build_dmg.sh LLMTray-Full.dmg
      # The release (with its DMGs) is created BEFORE the appcast goes
      # live: the appcast's enclosure points at this tag's asset, so
      # publishing it first would offer every Sparkle client a 404 if the
      # upload failed.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build/app/LLMTray.dmg
            .build/app/LLMTray-Full.dmg
          generate_release_notes: true
          # vX.Y.Z-beta.N tags: a GitHub pre-release, so releases/latest
          # (the website's download links) keeps pointing at stable.
          prerelease: ${{ contains(github.ref_name, '-') }}
      # generate_appcast.sh keeps the OTHER channel's item from the
      # existing feed, so it must start from main's current feed -- not
      # this tag's copy, which misses every bot commit made after the tag
      # was cut (a beta tagged on an older commit would otherwise drop the
      # current stable item, and vice versa).
      - name: Start from main's current appcast.xml
        run: |
          git fetch origin main
          git show origin/main:docs/appcast.xml > docs/appcast.xml
      - name: Generate signed appcast.xml
        run: ./scripts/generate_appcast.sh
        env:
          VERSION: ${{ env.VERSION }}
          TAG: ${{ github.ref_name }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      - name: Commit appcast.xml to main
        run: |
          # A tag push checks out that tag's commit in detached HEAD --
          # pushing that tree straight to main would be a non-fast-forward
          # (or worse, silently rewind main) if anything landed on main
          # after the tag was cut. Explicitly resetting to the real tip of
          # origin/main and applying only the appcast.xml change avoids that.
          cp docs/appcast.xml /tmp/appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- docs/appcast.xml
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/appcast.xml docs/appcast.xml
          git add docs/appcast.xml
          git diff --staged --quiet && echo "no appcast changes" || git commit -m "Update appcast.xml for ${{ github.ref_name }}"
          # Someone may push to main between the fetch and this push; the
          # commit only touches appcast.xml, so a rebase onto the new tip is
          # safe. Retried a few times rather than failing the release.
          for i in 1 2 3; do
            git push origin main && break
            git pull --rebase origin main
          done
