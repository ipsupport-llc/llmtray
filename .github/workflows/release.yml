name: Release

# Builds LLMTray.app and attaches it (as a drag-to-Applications .dmg) to a
# GitHub Release whenever a version tag is pushed. Ad-hoc signed only (no
# Developer ID/notarization secrets configured) -- users launch it once via
# right-click > Open to clear Gatekeeper, same as any unsigned/ad-hoc app
# from outside the App Store.
#
# The asset is always named LLMTray.dmg (no version in the filename) so
# https://github.com/<owner>/<repo>/releases/latest/download/LLMTray.dmg
# is a permanent link to whatever's newest -- used by docs/index.html's
# download button, which would otherwise need editing on every release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build LLMTray.app
        run: ./scripts/build_app.sh
        env:
          VERSION: ${{ env.VERSION }}
      - name: Build DMG
        run: ./scripts/build_dmg.sh
      - name: Generate signed appcast.xml
        run: ./scripts/generate_appcast.sh
        env:
          VERSION: ${{ env.VERSION }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      - name: Commit appcast.xml to main
        run: |
          # A tag push checks out that tag's commit in detached HEAD --
          # pushing that tree straight to main would be a non-fast-forward
          # (or worse, silently rewind main) if anything landed on main
          # after the tag was cut. Explicitly resetting to the real tip of
          # origin/main and applying only the appcast.xml change avoids that.
          cp docs/appcast.xml /tmp/appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/appcast.xml docs/appcast.xml
          git add docs/appcast.xml
          git diff --staged --quiet && echo "no appcast changes" || git commit -m "Update appcast.xml for ${{ github.ref_name }}"
          git push origin main
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: .build/app/LLMTray.dmg
          generate_release_notes: true
