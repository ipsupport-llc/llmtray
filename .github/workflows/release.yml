name: Release

# Builds LLMTray.app and attaches it (as a drag-to-Applications .dmg) to a
# GitHub Release whenever a version tag is pushed. Signed with IPSupport
# LLC's Developer ID (hardened runtime) and notarized + stapled, so
# Gatekeeper opens it with no "Open Anyway" -- when the signing secrets are
# set (DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD, NOTARY_KEY_P8_BASE64,
# NOTARY_KEY_ID, NOTARY_ISSUER_ID). Without them (a fork) it stays ad-hoc,
# as before. The certificate lives only in a throwaway keychain and the API
# key only in a runner temp file, both removed at the end whatever happens.
#
# Produces two DMGs from the same build: LLMTray.dmg (thin -- bootstraps
# mlx-lm via pip on first launch) and LLMTray-Full.dmg (same app with an
# official-python.org-sourced Python + mlx-lm already vendored inside the
# bundle, for machines with no compatible Python or that would rather skip
# the first-run install). Both are built from the *same* .build/app/LLMTray.app
# directory -- build_full_app.sh mutates it in place after the thin DMG is
# already captured, so the two DMGs must be built in this order.
#
# Asset names have no version in them so
# https://github.com/<owner>/<repo>/releases/latest/download/LLMTray.dmg
# (and .../LLMTray-Full.dmg) are permanent links to whatever's newest --
# used by docs/index.html's download buttons, which would otherwise need
# editing on every release.
# Tags vX.Y.Z (stable) or vX.Y.Z-beta.N (beta: a GitHub pre-release, and
# the Sparkle "beta" channel that only users with beta updates on get).
#
# The update feed (appcast.xml) is not committed anywhere: this uploads the
# release's own signed metadata (LLMTray.dmg.sparkle.json) and triggers
# pages.yml, which rebuilds the whole feed from the releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write   # dispatch pages.yml

# Per tag: releases share no state any more (the feed is rebuilt from all
# of them), so a stable and a beta can run side by side; a re-run of the
# same tag waits for the first.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # The Developer ID certificate into a keychain of this job only; the
      # notary API key into a 0600 temp file. Neither is ever printed.
      - name: Set up signing
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [[ -z "$P12_BASE64" ]]; then
            echo "no signing secrets: ad-hoc build"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          umask 077
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer_id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer_id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer_id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          [[ -n "$IDENTITY" ]] || { echo "error: no Developer ID Application identity in the certificate" >&2; exit 1; }
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary_key.p8"
          {
            echo "SIGN_IDENTITY=$IDENTITY"
            echo "SIGNING_KEYCHAIN=$KEYCHAIN"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary_key.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"
          echo "signing as: $IDENTITY"
      - name: Build LLMTray.app
        run: ./scripts/build_app.sh
        env:
          VERSION: ${{ env.VERSION }}
      - name: Build DMG (thin)
        run: ./scripts/build_dmg.sh
      - name: Notarize DMG (thin)
        run: ./scripts/notarize.sh .build/app/LLMTray.dmg
      - name: Vendor full runtime into LLMTray.app
        run: ./scripts/build_full_app.sh
      - name: Build DMG (full)
        run: ./scripts/build_dmg.sh LLMTray-Full.dmg
      - name: Notarize DMG (full)
        run: ./scripts/notarize.sh .build/app/LLMTray-Full.dmg
      # After stapling: stapling changes the DMG Sparkle signs.
      - name: Sign for Sparkle (writes LLMTray.dmg.sparkle.json)
        run: ./scripts/sign_release.sh
        env:
          VERSION: ${{ env.VERSION }}
          TAG: ${{ github.ref_name }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      # DMGs and their signature go up together into a draft, published
      # only once all are there -- the feed (which skips drafts) never sees
      # a half-uploaded release. A re-run of a published one replaces the
      # files; render_appcast skips a DMG that doesn't match its signature.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # A hotfix on an older line must not become "latest" (the
          # website's download links): GitHub's date + semver rule.
          make_latest: legacy
          files: |
            .build/app/LLMTray.dmg
            .build/app/LLMTray-Full.dmg
            .build/app/LLMTray.dmg.sparkle.json
          generate_release_notes: true
          # vX.Y.Z-beta.N tags: a GitHub pre-release, so releases/latest
          # (the website's download links) keeps pointing at stable.
          prerelease: ${{ contains(github.ref_name, '-') }}
      # make_latest has to go with the publishing request itself (GitHub
      # applies it then; a draft's is ignored): an older maintenance
      # release must not become "latest".
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1)"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false -f make_latest=legacy > /dev/null
      # A release created with GITHUB_TOKEN doesn't fire `release` events
      # for other workflows; a dispatch does. On main: the github-pages
      # environment only deploys from main.
      - name: Rebuild the update feed and site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - name: Remove signing material
        if: always()
        run: |
          [[ -n "${SIGNING_KEYCHAIN:-}" ]] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary_key.p8" "$RUNNER_TEMP/developer_id.p12"
