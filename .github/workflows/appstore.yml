name: App Store pkg

# Builds the Mac App Store installer package for a stable release tag:
# started by release.yml after every stable tag (with deliver and submit),
# or by hand (Actions > App Store pkg > Run workflow). Not for betas: App
# Store versions are numbers only.
# The .pkg is a workflow artifact. With "deliver" it also goes to App Store
# Connect (ADR 0033): the deliver job waits for the owner's approval in the
# "app-store" environment, then uploads the build, finds or creates the
# version, pushes the listing texts for every language and attaches the
# build. The version stays in "Prepare for Submission"; sending it to
# review is the "App Store submit" workflow, which "submit" starts after a
# delivery (it waits for its own approval).
#
# Secrets: APPSTORE_P12_BASE64 + APPSTORE_P12_PASSWORD -- one .p12 with both
# identities, "Apple Distribution" and "3rd Party Mac Developer Installer"
# (Keychain Access: select both, Export 2 items); APPSTORE_PROFILE_BASE64 --
# the "LLMTray App Store" provisioning profile for us.ipsupport.llmtray.appstore.
# They live only in a throwaway keychain and temp files, removed at the end.
# The "app-store" environment's own: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
# -- an App Store Connect team key, role App Manager (the .p8 file's text).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (stable, e.g. v0.8.6)"
        required: true
      build_number:
        description: "Build number, for another upload of the same version: higher than the last one, 1-3 numbers (e.g. 0.8.601); empty: the version"
        required: false
        default: ""
      deliver:
        description: "Deliver to App Store Connect after the build (needs approval; needs appstore/metadata/en-US/release_notes.txt on main)"
        type: boolean
        default: false
      submit:
        description: "After delivery, start App Store submit for this version (needs its own approval)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: appstore-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  pkg:
    runs-on: macos-15
    outputs:
      version: ${{ steps.check.outputs.version }}
      build: ${{ steps.check.outputs.build }}
      pkg: ${{ steps.name.outputs.pkg }}
    steps:
      - name: Check the tag
        id: check
        env:
          TAG: ${{ inputs.tag }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          # App Store versions are numbers only: no betas.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "error: $TAG isn't a stable tag (vX.Y.Z)" >&2; exit 1; }
          VERSION="${TAG#v}"
          if [[ -n "$BUILD_NUMBER" ]]; then
            # CFBundleVersion: at most three numbers (Apple ignores a fourth).
            [[ "$BUILD_NUMBER" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "error: build number $BUILD_NUMBER isn't N[.N[.N]]" >&2; exit 1; }
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD_NUMBER:-$VERSION}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      # The app from the tag, the build scripts from where this workflow runs
      # (main): a fix to packaging (e.g. ITMS-90284) also builds an older tag.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .ci-scripts
          sparse-checkout: scripts
      - name: Use the current build scripts
        run: |
          cp -R .ci-scripts/scripts/. scripts/
          rm -rf .ci-scripts
          git status --short scripts | head -20
      - name: Set up signing
        env:
          P12_BASE64: ${{ secrets.APPSTORE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPSTORE_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
        run: |
          [[ -n "$P12_BASE64" && -n "$PROFILE_BASE64" ]] || { echo "error: APPSTORE_P12_BASE64 / APPSTORE_PROFILE_BASE64 aren't set" >&2; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/appstore.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          umask 077
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/appstore.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/appstore.provisionprofile"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/appstore.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          rm -f "$RUNNER_TEMP/appstore.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # By hash: names can repeat (a renewed certificate next to the old
          # one). The Apple Distribution identity must be one the profile
          # lists, or App Store Connect refuses the upload.
          security cms -D -i "$RUNNER_TEMP/appstore.provisionprofile" > "$RUNNER_TEMP/profile.plist"
          ALLOWED=""
          COUNT="$(plutil -extract DeveloperCertificates raw "$RUNNER_TEMP/profile.plist")"
          for ((i = 0; i < COUNT; i++)); do
            ALLOWED+=" $(plutil -extract "DeveloperCertificates.$i" raw "$RUNNER_TEMP/profile.plist" | base64 --decode \
              | openssl x509 -inform der -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)"
          done
          rm -f "$RUNNER_TEMP/profile.plist"
          APP_ID=""
          for hash in $(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/"Apple Distribution: /{print $2}'); do
            [[ " $ALLOWED " == *" $hash "* ]] && { APP_ID="$hash"; break; }
          done
          [[ -n "$APP_ID" ]] || { echo "error: no Apple Distribution identity in APPSTORE_P12_BASE64 is in the provisioning profile (profile allows:$ALLOWED)" >&2; exit 1; }
          PKG_ID="$(security find-identity -v "$KEYCHAIN" | awk '/"3rd Party Mac Developer Installer: /{print $2; exit}')"
          [[ -n "$PKG_ID" ]] || { echo "error: no 3rd Party Mac Developer Installer identity in APPSTORE_P12_BASE64" >&2; exit 1; }
          {
            echo "SIGN_IDENTITY=$APP_ID"
            echo "INSTALLER_IDENTITY=$PKG_ID"
            echo "APPSTORE_PROFILE=$RUNNER_TEMP/appstore.provisionprofile"
            echo "SIGNING_KEYCHAIN=$KEYCHAIN"
          } >> "$GITHUB_ENV"
      - name: Build the App Store pkg
        run: ./scripts/build_appstore.sh
      - name: Check the pkg
        id: name
        run: |
          APP=.build/appstore/LLMTray.app
          PKG=.build/appstore/LLMTray.pkg
          codesign --verify --deep --strict "$APP"
          # App Store Connect refuses any Mach-O without the signature
          # (ITMS-90284), which codesign --deep doesn't catch.
          unsigned=0; total=0
          while IFS= read -r -d '' f; do
            file "$f" | grep -q "Mach-O" || continue
            total=$((total + 1))
            codesign -v "$f" 2>/dev/null || { echo "unsigned: ${f#$APP/}"; unsigned=$((unsigned + 1)); }
          done < <(find "$APP" -type f -print0)
          echo "Mach-O files: $total, unsigned: $unsigned"
          [[ "$unsigned" == 0 ]]
          LEFT="$(find "$APP" \( -name "*.o" -o -name "*.a" -o -name "*Config.sh" \) | head -1)"
          [[ -z "$LEFT" ]] || { echo "error: $LEFT" >&2; exit 1; }
          # ITMS-90332: every link resolves, inside the app.
          ROOT="$(cd "$APP" && pwd -P)"
          while IFS= read -r -d '' link; do
            # The link read before the cd: its path is relative to here.
            rel="$(readlink "$link" || true)"
            target="$(cd "$(dirname "$link")" && realpath "$rel" 2>/dev/null || true)"
            [[ -n "$target" && -e "$target" && "$target" == "$ROOT"/* ]] || { echo "error: link to nothing or outside the app: ${link#$APP/}" >&2; exit 1; }
          done < <(find "$APP" -type l -print0)
          # ITMS-91109: no quarantine (or any other) extended attribute.
          XATTRS="$(xattr -lr "$APP" | head -3)"
          [[ -z "$XATTRS" ]] || { echo "error: extended attributes in the app: $XATTRS" >&2; exit 1; }
          SHORT="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")"
          BUNDLE="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist")"
          ID="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist")"
          echo "$ID $SHORT ($BUNDLE)"
          [[ "$SHORT" == "$VERSION" && "$ID" == us.ipsupport.llmtray.appstore ]]
          [[ -z "$BUILD_NUMBER" || "$BUNDLE" == "$BUILD_NUMBER" ]]
          pkgutil --check-signature "$PKG" | grep -q "3rd Party Mac Developer Installer"
          mv "$PKG" ".build/appstore/LLMTray-$SHORT-AppStore.pkg"
          echo "PKG_NAME=LLMTray-$SHORT-AppStore${BUILD_NUMBER:+-$BUILD_NUMBER}" >> "$GITHUB_ENV"
          if [[ -n "$BUILD_NUMBER" ]]; then mv ".build/appstore/LLMTray-$SHORT-AppStore.pkg" ".build/appstore/LLMTray-$SHORT-AppStore-$BUILD_NUMBER.pkg"; fi
          echo "pkg=LLMTray-$SHORT-AppStore${BUILD_NUMBER:+-$BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: .build/appstore/${{ env.PKG_NAME }}.pkg
          retention-days: 30
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: |
          [[ -n "${SIGNING_KEYCHAIN:-}" ]] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/appstore.p12" "$RUNNER_TEMP/appstore.provisionprofile"

  # To App Store Connect, after the owner approves the run. The scripts and
  # the listing texts come from main: the listing is tuned between releases.
  deliver:
    needs: pkg
    if: ${{ inputs.deliver }}
    runs-on: macos-15
    environment: app-store
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write   # start App Store submit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts/appstore
            appstore/metadata
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.pkg.outputs.pkg }}
          path: pkg
      - name: Deliver
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          VERSION: ${{ needs.pkg.outputs.version }}
          BUILD: ${{ needs.pkg.outputs.build }}
          PKG: pkg/${{ needs.pkg.outputs.pkg }}.pkg
        run: |
          [[ -n "$ASC_KEY_ID" && -n "$ASC_ISSUER_ID" && -n "$ASC_KEY_P8" ]] || { echo "error: the app-store environment has no ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8" >&2; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          export ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          python3 scripts/appstore/asc_release.py deliver --apply --file "$PKG" --version "$VERSION" --build "$BUILD"
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
      - name: Start App Store submit
        if: ${{ inputs.submit }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.pkg.outputs.version }}
        run: gh workflow run appstore-submit.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"
