name: App Store pkg

# Builds the Mac App Store installer package for a release tag, by hand
# (Actions > App Store pkg > Run workflow): not on every push or tag -- it
# takes a while and is needed only when a version goes to the App Store.
# The .pkg is a workflow artifact; nothing is uploaded to App Store
# Connect from here (that stays a person's step, in Transporter).
#
# Secrets: APPSTORE_P12_BASE64 + APPSTORE_P12_PASSWORD -- one .p12 with both
# identities, "Apple Distribution" and "3rd Party Mac Developer Installer"
# (Keychain Access: select both, Export 2 items); APPSTORE_PROFILE_BASE64 --
# the "LLMTray App Store" provisioning profile for us.ipsupport.llmtray.appstore.
# They live only in a throwaway keychain and temp files, removed at the end.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (stable, e.g. v0.8.6)"
        required: true
      build_number:
        description: "Build number, for another upload of the same version: higher than the last one, 1-3 numbers (e.g. 0.8.601); empty: the version"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: appstore-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  pkg:
    runs-on: macos-15
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          # App Store versions are numbers only: no betas.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "error: $TAG isn't a stable tag (vX.Y.Z)" >&2; exit 1; }
          VERSION="${TAG#v}"
          if [[ -n "$BUILD_NUMBER" ]]; then
            # CFBundleVersion: at most three numbers (Apple ignores a fourth).
            [[ "$BUILD_NUMBER" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "error: build number $BUILD_NUMBER isn't N[.N[.N]]" >&2; exit 1; }
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      # The app from the tag, the build scripts from where this workflow runs
      # (main): a fix to packaging (e.g. ITMS-90284) also builds an older tag.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .ci-scripts
          sparse-checkout: scripts
      - name: Use the current build scripts
        run: |
          cp -R .ci-scripts/scripts/. scripts/
          rm -rf .ci-scripts
          git status --short scripts | head -20
      - name: Set up signing
        env:
          P12_BASE64: ${{ secrets.APPSTORE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPSTORE_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
        run: |
          [[ -n "$P12_BASE64" && -n "$PROFILE_BASE64" ]] || { echo "error: APPSTORE_P12_BASE64 / APPSTORE_PROFILE_BASE64 aren't set" >&2; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/appstore.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          umask 077
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/appstore.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/appstore.provisionprofile"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/appstore.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          rm -f "$RUNNER_TEMP/appstore.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # By hash: names can repeat (a renewed certificate next to the old
          # one). The Apple Distribution identity must be one the profile
          # lists, or App Store Connect refuses the upload.
          security cms -D -i "$RUNNER_TEMP/appstore.provisionprofile" > "$RUNNER_TEMP/profile.plist"
          ALLOWED=""
          COUNT="$(plutil -extract DeveloperCertificates raw "$RUNNER_TEMP/profile.plist")"
          for ((i = 0; i < COUNT; i++)); do
            ALLOWED+=" $(plutil -extract "DeveloperCertificates.$i" raw "$RUNNER_TEMP/profile.plist" | base64 --decode \
              | openssl x509 -inform der -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)"
          done
          rm -f "$RUNNER_TEMP/profile.plist"
          APP_ID=""
          for hash in $(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/"Apple Distribution: /{print $2}'); do
            [[ " $ALLOWED " == *" $hash "* ]] && { APP_ID="$hash"; break; }
          done
          [[ -n "$APP_ID" ]] || { echo "error: no Apple Distribution identity in APPSTORE_P12_BASE64 is in the provisioning profile (profile allows:$ALLOWED)" >&2; exit 1; }
          PKG_ID="$(security find-identity -v "$KEYCHAIN" | awk '/"3rd Party Mac Developer Installer: /{print $2; exit}')"
          [[ -n "$PKG_ID" ]] || { echo "error: no 3rd Party Mac Developer Installer identity in APPSTORE_P12_BASE64" >&2; exit 1; }
          {
            echo "SIGN_IDENTITY=$APP_ID"
            echo "INSTALLER_IDENTITY=$PKG_ID"
            echo "APPSTORE_PROFILE=$RUNNER_TEMP/appstore.provisionprofile"
            echo "SIGNING_KEYCHAIN=$KEYCHAIN"
          } >> "$GITHUB_ENV"
      - name: Build the App Store pkg
        run: ./scripts/build_appstore.sh
      - name: Check the pkg
        run: |
          APP=.build/appstore/LLMTray.app
          PKG=.build/appstore/LLMTray.pkg
          codesign --verify --deep --strict "$APP"
          # App Store Connect refuses any Mach-O without the signature
          # (ITMS-90284), which codesign --deep doesn't catch.
          unsigned=0; total=0
          while IFS= read -r -d '' f; do
            file "$f" | grep -q "Mach-O" || continue
            total=$((total + 1))
            codesign -v "$f" 2>/dev/null || { echo "unsigned: ${f#$APP/}"; unsigned=$((unsigned + 1)); }
          done < <(find "$APP" -type f -print0)
          echo "Mach-O files: $total, unsigned: $unsigned"
          [[ "$unsigned" == 0 ]]
          LEFT="$(find "$APP" \( -name "*.o" -o -name "*.a" \) | head -1)"
          [[ -z "$LEFT" ]] || { echo "error: $LEFT" >&2; exit 1; }
          SHORT="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")"
          BUNDLE="$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist")"
          ID="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist")"
          echo "$ID $SHORT ($BUNDLE)"
          [[ "$SHORT" == "$VERSION" && "$ID" == us.ipsupport.llmtray.appstore ]]
          [[ -z "$BUILD_NUMBER" || "$BUNDLE" == "$BUILD_NUMBER" ]]
          pkgutil --check-signature "$PKG" | grep -q "3rd Party Mac Developer Installer"
          mv "$PKG" ".build/appstore/LLMTray-$SHORT-AppStore.pkg"
          echo "PKG_NAME=LLMTray-$SHORT-AppStore${BUILD_NUMBER:+-$BUILD_NUMBER}" >> "$GITHUB_ENV"
          if [[ -n "$BUILD_NUMBER" ]]; then mv ".build/appstore/LLMTray-$SHORT-AppStore.pkg" ".build/appstore/LLMTray-$SHORT-AppStore-$BUILD_NUMBER.pkg"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: .build/appstore/${{ env.PKG_NAME }}.pkg
          retention-days: 30
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: |
          [[ -n "${SIGNING_KEYCHAIN:-}" ]] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/appstore.p12" "$RUNNER_TEMP/appstore.provisionprofile"
